(function(){var errs=[];window.addEventListener('error',function(e){errs.push(e.message||'script error');});window.addEventListener('unhandledrejection',function(e){errs.push(String(e.reason&&e.reason.message||e.reason));});
 setTimeout(function(){if(document.querySelector('.login-screen')||document.querySelector('#selfpunch')||(document.querySelector('#side')&&document.querySelector('#side').children.length))return;
  var d=document.createElement('div');d.dir='rtl';d.style.cssText='font:16px/1.9 Tahoma,sans-serif;max-width:560px;margin:40px auto;padding:20px;background:#fff;border:1px solid #ddd;border-radius:12px;color:#111';
  d.innerHTML='<h2 style="margin-top:0">تعذر تشغيل النظام</h2><p>الأسباب المحتملة:</p><ul><li>فتح الملف مباشرة من الجهاز (file://). يجب فتحه من رابط https.</li><li>تعذر تحميل مكتبات Firebase (إنترنت أو حاجب إعلانات أو شبكة تحجب gstatic.com).</li><li>ملفات <b>js</b> أو <b>css</b> غير مرفوعة بجانب index.html.</li></ul>'+(errs.length?'<p dir="ltr" style="font-size:13px;color:#b00">'+errs.slice(0,3).join('<br>').replace(/</g,'&lt;')+'</p>':'');
  document.body.appendChild(d);},8000);})();
</script>
